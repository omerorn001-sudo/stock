name: A股每日龙虎榜归档

on:
  push:
    branches: [main]
    paths:
      - "src/dragon_tiger.py"
      - "src/dragon_tiger_html.py"
      - "src/apps_script_storage.py"
      - "apps-script/Code.gs"
      - "tests/test_dragon_tiger.py"
      - "tests/test_dragon_tiger_html.py"
      - "tests/test_apps_script_storage.py"
      - ".github/workflows/dragon-tiger.yml"
      - "requirements-juchao.txt"
      - "scripts/drive_archive.py"
      - "scripts/trading_days.py"
  pull_request:
    paths:
      - "src/dragon_tiger.py"
      - "src/dragon_tiger_html.py"
      - "src/apps_script_storage.py"
      - "apps-script/Code.gs"
      - "tests/test_dragon_tiger.py"
      - "tests/test_dragon_tiger_html.py"
      - "tests/test_apps_script_storage.py"
      - ".github/workflows/dragon-tiger.yml"
      - "requirements-juchao.txt"
      - "scripts/drive_archive.py"
      - "scripts/trading_days.py"
  schedule:
    # UTC 12:10 = 北京时间 20:10，周一至周五；节假日无数据时正常跳过上传。
    - cron: "10 12 * * 1-5"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "交易日期 YYYY-MM-DD，可用逗号/空格填写多个；留空为北京时间今日"
        required: false
        type: string
      start:
        description: "批量补全：开始日期 YYYY-MM-DD（填了就按区间补全，忽略单日）"
        required: false
        type: string
      end:
        description: "批量补全：结束日期 YYYY-MM-DD；留空 = 今天"
        required: false
        type: string
      upload_drive:
        description: "上传 HTML + PDF 报告到 Google Drive（CNINFO/龙虎榜）"
        required: true
        type: boolean
        default: true

concurrency:
  group: dragon-tiger-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dragon-tiger pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-juchao.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-juchao.txt
      - name: Compile Python and Apps Script
        run: |
          python -m compileall -q src tests
          node --check < apps-script/Code.gs
      - name: Critical static checks
        run: |
          ruff check --select E9,F63,F7,F82 \
            src/dragon_tiger.py src/dragon_tiger_html.py src/apps_script_storage.py \
            tests/test_dragon_tiger.py tests/test_dragon_tiger_html.py \
            tests/test_apps_script_storage.py
      - name: Unit tests
        run: |
          python -m pytest -q \
            tests/test_dragon_tiger.py tests/test_dragon_tiger_html.py \
            tests/test_apps_script_storage.py
      - name: Best-effort live data probe
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          python -m src.dragon_tiger \
            --date 2026-08-11 \
            --output artifacts/dragon-tiger-probe
          python -m src.dragon_tiger_html \
            --date 2026-08-11 \
            --output artifacts/dragon-tiger-probe
      - name: Upload probe artifact
        if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v5
        with:
          name: dragon-tiger-live-probe
          path: artifacts/dragon-tiger-probe/
          if-no-files-found: warn
          retention-days: 7

  plan:
    name: Plan archive dates
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: plan
        shell: bash
        env:
          IN_DATE: ${{ inputs.trade_date }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          today=$(TZ=Asia/Shanghai date +%F)
          start=$(echo "${IN_START:-}" | tr -d '[:space:]'); end=$(echo "${IN_END:-}" | tr -d '[:space:]')
          single=$(echo "${IN_DATE:-}" | tr ',，' '  ' | xargs)
          if [[ -n "$start" ]]; then
            matrix=$(python scripts/trading_days.py --start "$start" --end "${end:-$today}" --chunk 15 --matrix)
          else
            d="${single:-$today}"
            python -c 'from datetime import date; import sys; [date.fromisoformat(v) for v in sys.argv[1:]]; assert all(date.fromisoformat(v).isoformat()==v for v in sys.argv[1:])' $d
            label=$(echo "$d" | awk '{print (NF>1) ? $1 "等" NF "天" : $1}')
            matrix=$(jq -cn --arg d "$d" --arg l "$label" '{include:[{label:$l,dates:$d}]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[].label'

  archive:
    name: Archive ${{ matrix.label }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      issues: write
    env:
      TZ: Asia/Shanghai
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload_drive }}
      DATES: ${{ matrix.dates }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-juchao.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-juchao.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: Fetch data and build HTML + PDF
        id: run
        shell: bash
        run: |
          failed=0
          for d in $DATES; do
            echo "::group::$d"
            if ! python -m src.dragon_tiger --date "$d" --output artifacts/dragon-tiger; then
              echo "::error::$d 数据采集失败"; failed=1; echo "::endgroup::"; continue
            fi
            count=$(python -c 'import json,sys; print(len(json.load(open(sys.argv[1],encoding="utf-8")).get("records") or []))' "artifacts/dragon-tiger/$d/龙虎榜_$d.json" 2>/dev/null || echo 0)
            if [[ "$count" == "0" ]]; then echo "$d 无龙虎榜数据（非交易日），跳过"; echo "::endgroup::"; continue; fi
            if ! python -m src.dragon_tiger_html --date "$d" --output artifacts/dragon-tiger; then
              echo "::error::$d HTML 生成失败"; failed=1; echo "::endgroup::"; continue
            fi
            if [[ "$UPLOAD" == "true" ]]; then
              python scripts/drive_archive.py --dataset dragon_tiger --date "$d" \
                --pdf-dir "artifacts/dragon-tiger/$d" "artifacts/dragon-tiger/$d/龙虎榜报告_$d.html" || failed=1
            fi
            echo "::endgroup::"
          done
          echo "trade_date=${DATES%% *}" >> "$GITHUB_OUTPUT"
          test "$failed" = "0"
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dragon-tiger-${{ matrix.label }}
          path: artifacts/dragon-tiger/
          if-no-files-found: warn
          retention-days: 14
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRADE_DATE: ${{ matrix.label }}
        with:
          script: |
            const title = '[龙虎榜] 每日 Drive 归档失败';
            const body = `交易日：${process.env.TRADE_DATE}\n\n运行：${process.env.RUN_URL}`;
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const existing = issues.find((item) => item.title === title);
            if (existing) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
      - name: Close recovered failure issue
        if: success() && github.event_name == 'schedule'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[龙虎榜] 每日 Drive 归档失败';
            const { data: issues } = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100});
            const existing = issues.find((item) => item.title === title);
            if (existing) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed', state_reason: 'completed'});
