name: 基金 TOP50 与持仓分析

on:
  schedule:
    # 每周一次：UTC 周五 23:35 = 北京时间周六 07:35（周五净值已更新）
    - cron: '35 23 * * 5'
  workflow_dispatch:
    inputs:
      category:
        description: 排名基金范围
        type: choice
        default: 全部
        options: [全部, 股票型, 混合型, 债券型, 指数型, QDII, FOF]
  push:
    branches: [main]
    paths: ['fund_tracker/**', '.github/workflows/fund-tracker.yml']
  pull_request:
    paths: ['fund_tracker/**', '.github/workflows/fund-tracker.yml']

permissions:
  contents: read

concurrency:
  group: fund-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fund_tracker/requirements-test.txt
      - run: pip install -r fund_tracker/requirements-test.txt
      - run: python -m unittest discover -s fund_tracker/tests -v

  collect:
    needs: test
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
      CATEGORY: ${{ inputs.category || '全部' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fund_tracker/requirements.txt
      - name: 安装已核对版本的数据接口
        run: pip install -r fund_tracker/requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/fund_tracker
          key: ${{ runner.os }}-fund-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-fund-v1-
      - name: 采集并生成基金报告
        run: python -m fund_tracker.main --category "$CATEGORY"
      - name: 显示运行摘要
        if: success()
        run: cat reports/funds/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: 保存报告、原始响应与失败诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fund-tracker-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/funds/
            artifacts/fund-tracker/
          retention-days: 14
          if-no-files-found: warn
      - name: 安装 PDF 中文字体
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
      - name: 提交周报（仓库只保留 HTML）
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # 只保留 HTML；CSV / JSON / Markdown 仅保存在本次 Actions 附件中
          git ls-files reports/funds | grep -vE '\.html$' | xargs -r git rm -q --cached --
          find reports/funds -type f ! -name '*.html' -delete
          git add -- 'reports/funds/*.html'
          if git diff --cached --quiet; then
            echo '没有新的基金报告'
            exit 0
          fi
          git commit -m "funds: weekly snapshot $(date +%F)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((RANDOM % 20 + 5))
          done
          echo '提交失败：检查仓库写权限/分支保护；报告仍保存在本次 Actions 附件中。'
          exit 1
      - name: 归档 HTML + PDF 到 Google Drive（CNINFO/基金TOP50与持仓分析）
        if: success()
        shell: bash
        run: |
          dir=$(ls -d reports/funds/20??-??-?? 2>/dev/null | sort | tail -1)
          if [[ -z "$dir" ]]; then echo "没有找到基金报告，跳过 Drive 归档"; exit 0; fi
          d=$(basename "$dir")
          python scripts/drive_archive.py --dataset fund_tracker --date "$d" \
            --name "基金TOP50与持仓分析_$d" "$dir/index.html"
