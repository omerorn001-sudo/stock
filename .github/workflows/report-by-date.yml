name: A股指定日期报告（手动）

on:
  workflow_dispatch:
    inputs:
      date:
        description: '交易日日期，格式 YYYY-MM-DD（例如 2026-07-31）'
        required: true
        type: string
      upload_drive:
        description: '将 PDF 上传到 Google Drive'
        required: true
        type: boolean
        default: true
      upload_artifact:
        description: '额外保存 GitHub PDF 附件（需要可用的 Artifact 存储额度）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: report-by-date-${{ github.event.inputs.date }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: gdrive-apps-script-archive
      cancel-in-progress: false
    env:
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装 Drive 上传依赖
        run: python -m pip install --disable-pip-version-check 'requests>=2.32.0'

      - name: 校验报告日期
        id: report-date
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          report_date="$(python scripts/report_date.py --date "$REQUESTED_DATE")"
          echo "date=${report_date}" >> "$GITHUB_OUTPUT"

      - name: 生成指定日期 HTML 报告
        id: generate
        env:
          REPORT_DATE: ${{ steps.report-date.outputs.date }}
        run: |
          rm -f "reports/${REPORT_DATE}.html"
          bun run src/report-by-date.ts "$REPORT_DATE"
          test -s "reports/${REPORT_DATE}.html"

      - name: 提交 HTML 报告
        env:
          REPORT_DATE: ${{ steps.report-date.outputs.date }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reports/${REPORT_DATE}.html"
          if git diff --cached --quiet; then
            echo "报告没有变化，跳过提交。"
            exit 0
          fi
          git commit -m "report(${REPORT_DATE}): 指定日期报告"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: 生成 PDF 并按需上传 Google Drive
        id: pdf
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        shell: bash
        env:
          REPORT_DATE: ${{ steps.report-date.outputs.date }}
          UPLOAD_DRIVE: ${{ inputs.upload_drive }}
        run: |
          args=(report
            --html "reports/${REPORT_DATE}.html"
            --pdf "reports/${REPORT_DATE}.pdf"
            --date "$REPORT_DATE")
          if [[ "$UPLOAD_DRIVE" == "true" ]]; then
            args+=(--upload-drive)
          fi
          python scripts/pdf_drive.py "${args[@]}"

      - name: 可选的 GitHub PDF 备份
        id: artifact
        if: ${{ !cancelled() && inputs.upload_artifact == true && steps.pdf.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: a-share-report-${{ steps.report-date.outputs.date }}
          path: reports/${{ steps.report-date.outputs.date }}.pdf
          if-no-files-found: error
          retention-days: 7

      - name: 提示附件备份失败
        if: ${{ !cancelled() && steps.artifact.outcome == 'failure' }}
        run: |
          echo "::warning::GitHub 附件备份失败。HTML 提交和云盘归档步骤已独立执行，请分别查看其状态。"
