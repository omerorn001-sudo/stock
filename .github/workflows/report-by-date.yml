name: A股指定日期报告（手动）

on:
  workflow_dispatch:
    inputs:
      date:
        description: '交易日日期，格式 YYYY-MM-DD（例如 2026-07-31）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: report-by-date-${{ github.event.inputs.date }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 生成指定日期报告
        run: bun run src/report-by-date.ts "${{ github.event.inputs.date }}"

      - name: 提交报告
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "report(${{ github.event.inputs.date }}): 指定日期报告"
          git pull --rebase --autostash || true
          git push
