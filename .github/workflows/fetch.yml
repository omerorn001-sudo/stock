name: juchao-research-pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/phase1.py"
      - "src/pipeline.py"
      - "src/research_complete.py"
      - "src/drive_storage.py"
      - "src/apps_script_storage.py"
      - "tests/**"
      - ".github/workflows/fetch.yml"
      - ".github/workflows/backfill.yml"
      - "requirements-juchao.txt"
  pull_request:
    paths:
      - "src/phase1.py"
      - "src/pipeline.py"
      - "src/research_complete.py"
      - "src/drive_storage.py"
      - "src/apps_script_storage.py"
      - "tests/**"
      - ".github/workflows/fetch.yml"
      - ".github/workflows/backfill.yml"
      - "requirements-juchao.txt"
  workflow_dispatch:
    inputs:
      start:
        description: "开始日期 YYYY-MM-DD（按公告日）"
        required: true
      end:
        description: "结束日期 YYYY-MM-DD（含当日）"
        required: true
      market:
        description: "市场范围（北交所始终排除）"
        type: choice
        options: [all, sh, sz]
        default: all
      upload_drive:
        description: "上传到 Google Drive"
        type: boolean
        default: true
      max_files:
        description: "最多处理数量；0表示不限制"
        required: true
        default: "0"
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: juchao-research-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-juchao.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-juchao.txt
      - name: Compile and lint
        run: |
          python -m compileall -q src scripts tests
          node --check < apps-script/Code.gs
          ruff check --select E9,F63,F7,F82 \
            src/phase1.py src/pipeline.py src/research_complete.py \
            src/drive_storage.py src/apps_script_storage.py \
            tests/test_phase1.py tests/test_research_complete.py \
            tests/test_pipeline.py tests/test_drive_storage.py \
            tests/test_apps_script_storage.py
      - name: Unit tests
        run: |
          python -m pytest -q \
            tests/test_phase1.py tests/test_research_complete.py \
            tests/test_pipeline.py tests/test_drive_storage.py \
            tests/test_apps_script_storage.py
      - name: Verify production entry points
        run: |
          grep -q "python -m src.research_complete" .github/workflows/fetch.yml
          grep -q "python -m src.research_complete" .github/workflows/backfill.yml

  archive:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
      GDRIVE_BASE_PATH: ${{ vars.GDRIVE_BASE_PATH || 'CNINFO/机构调研' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-juchao.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-juchao.txt
      - name: Resolve parameters
        id: params
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            start=$(TZ=Asia/Shanghai date -d '6 days ago' +%F)
            end=$(TZ=Asia/Shanghai date +%F)
            market=all
            upload=true
            max_files=0
            fail_on_empty=true
          else
            start="${{ inputs.start }}"
            end="${{ inputs.end }}"
            market="${{ inputs.market }}"
            upload="${{ inputs.upload_drive }}"
            max_files="${{ inputs.max_files }}"
            fail_on_empty=false
          fi
          if [[ "$upload" == "true" && ( -z "$GDRIVE_APPS_SCRIPT_URL" || -z "$GDRIVE_APPS_SCRIPT_TOKEN" ) ]]; then
            echo "::error::上传 Drive 需要 Apps Script URL 和 TOKEN"
            exit 1
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"
          echo "end=$end" >> "$GITHUB_OUTPUT"
          echo "market=$market" >> "$GITHUB_OUTPUT"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "max_files=$max_files" >> "$GITHUB_OUTPUT"
          echo "fail_on_empty=$fail_on_empty" >> "$GITHUB_OUTPUT"
      - name: Check Drive gateway
        if: steps.params.outputs.upload == 'true'
        run: |
          python - <<'PY'
          from src.apps_script_storage import AppsScriptDriveClient
          print(AppsScriptDriveClient().ping().get('service') or 'ok')
          PY
      - name: Run complete archive
        shell: bash
        run: |
          args=(--start "${{ steps.params.outputs.start }}" --end "${{ steps.params.outputs.end }}"
                --market "${{ steps.params.outputs.market }}"
                --max-files "${{ steps.params.outputs.max_files }}"
                --download-files --output artifacts/juchao-run)
          if [[ "${{ steps.params.outputs.upload }}" == "true" ]]; then args+=(--upload-drive); fi
          if [[ "${{ steps.params.outputs.fail_on_empty }}" == "true" ]]; then args+=(--fail-on-empty); fi
          python -m src.research_complete "${args[@]}"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: juchao-${{ steps.params.outputs.start }}-${{ steps.params.outputs.end }}
          path: artifacts/juchao-run/
          if-no-files-found: warn
          retention-days: 14
