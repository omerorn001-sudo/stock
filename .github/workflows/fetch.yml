name: juchao-research-pipeline

on:
  push:
    branches:
      - main
      - feat/juchao-institution-research
    paths:
      - "src/phase1.py"
      - "src/drive_storage.py"
      - "src/pipeline.py"
      - "scripts/backfill_matrix.py"
      - "tests/test_phase1.py"
      - "tests/test_drive_storage.py"
      - "tests/test_pipeline.py"
      - ".github/workflows/fetch.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "src/phase1.py"
      - "src/drive_storage.py"
      - "src/pipeline.py"
      - "scripts/backfill_matrix.py"
      - "tests/**"
      - ".github/workflows/fetch.yml"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      start:
        description: "开始日期 YYYY-MM-DD（按公告日）"
        required: true
      end:
        description: "结束日期 YYYY-MM-DD（含当日）"
        required: true
      market:
        description: "市场范围"
        type: choice
        options: [all, sh, sz]
        default: all
      upload_drive:
        description: "上传到 Google Drive"
        type: boolean
        default: true
      max_files:
        description: "最多处理数量；0表示不限制"
        required: true
        default: "0"
  schedule:
    - cron: "37 13 * * *"

concurrency:
  group: juchao-research-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate branch and source discovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint and unit tests
        run: |
          ruff check \
            src/phase1.py src/drive_storage.py src/pipeline.py \
            scripts/backfill_matrix.py \
            tests/test_phase1.py tests/test_drive_storage.py tests/test_pipeline.py
          pytest \
            tests/test_phase1.py tests/test_drive_storage.py tests/test_pipeline.py
      - name: Live metadata dry run
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: |
          python -m src.pipeline \
            --start 2025-03-07 \
            --end 2025-03-07 \
            --market all \
            --output artifacts/branch-validation \
            --fail-on-empty \
            --skip-run-manifest-upload
      - name: Upload validation artifact
        if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: actions/upload-artifact@v4
        with:
          name: juchao-branch-validation
          path: artifacts/branch-validation/
          if-no-files-found: warn
          retention-days: 7

  archive:
    name: Discover, download and archive
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
      issues: write
    env:
      TZ: Asia/Shanghai
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
      GDRIVE_BASE_PATH: ${{ vars.GDRIVE_BASE_PATH || 'CNINFO/机构调研' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resolve run parameters
        id: params
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "start=$(TZ=Asia/Shanghai date -d '6 days ago' +%F)" >> "$GITHUB_OUTPUT"
            echo "end=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
            echo "market=all" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "max_files=0" >> "$GITHUB_OUTPUT"
            echo "fail_on_empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "start=${{ inputs.start }}" >> "$GITHUB_OUTPUT"
            echo "end=${{ inputs.end }}" >> "$GITHUB_OUTPUT"
            echo "market=${{ inputs.market }}" >> "$GITHUB_OUTPUT"
            echo "upload=${{ inputs.upload_drive }}" >> "$GITHUB_OUTPUT"
            echo "max_files=${{ inputs.max_files }}" >> "$GITHUB_OUTPUT"
            echo "fail_on_empty=false" >> "$GITHUB_OUTPUT"
          fi
      - id: google_auth
        name: Authenticate with Workload Identity Federation
        if: >-
          steps.params.outputs.upload == 'true' &&
          env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
          env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
      - name: Run archive pipeline
        shell: bash
        run: |
          args=(
            --start "${{ steps.params.outputs.start }}"
            --end "${{ steps.params.outputs.end }}"
            --market "${{ steps.params.outputs.market }}"
            --max-files "${{ steps.params.outputs.max_files }}"
            --download-files
            --output artifacts/juchao-run
          )
          if [[ "${{ steps.params.outputs.upload }}" == "true" ]]; then
            args+=(--upload-drive)
          fi
          if [[ "${{ steps.params.outputs.fail_on_empty }}" == "true" ]]; then
            args+=(--fail-on-empty)
          fi
          python -m src.pipeline "${args[@]}"
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juchao-${{ steps.params.outputs.start }}-${{ steps.params.outputs.end }}
          path: artifacts/juchao-run/
          if-no-files-found: error
          retention-days: 14
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '[juchao] 机构调研归档流水线失败';
            const body = `运行失败：${process.env.RUN_URL}\n\n触发：${context.eventName}\n分支：${context.ref}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((item) => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
            }
      - name: Close recovered failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[juchao] 机构调研归档流水线失败';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            const existing = issues.find((item) => item.title === title);
            if (existing) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: `流水线已恢复：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, state: 'closed', state_reason: 'completed'});
            }
