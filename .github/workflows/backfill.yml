name: juchao-history-backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "历史回填开始日期 YYYY-MM-DD"
        required: true
      end:
        description: "历史回填结束日期 YYYY-MM-DD"
        required: true
      market:
        description: "市场范围（北交所始终排除）"
        type: choice
        options: [all, sh, sz]
        default: all
      upload_drive:
        description: "上传到 Google Drive"
        type: boolean
        default: true
      max_files_per_month:
        description: "每月最多处理数量；0表示不限制"
        required: true
        default: "0"

concurrency:
  group: juchao-history-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: matrix
        run: python scripts/backfill_matrix.py --start "${{ inputs.start }}" --end "${{ inputs.end }}"

  backfill:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
      GDRIVE_BASE_PATH: ${{ vars.GDRIVE_BASE_PATH || 'CNINFO/机构调研' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-juchao.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-juchao.txt
      - name: Check Drive gateway
        if: inputs.upload_drive == true
        run: |
          if [[ -z "$GDRIVE_APPS_SCRIPT_URL" || -z "$GDRIVE_APPS_SCRIPT_TOKEN" ]]; then
            echo "::error::上传 Drive 需要 Apps Script URL 和 TOKEN"
            exit 1
          fi
          python - <<'PY'
          from src.apps_script_storage import AppsScriptDriveClient
          print(AppsScriptDriveClient().ping().get('service') or 'ok')
          PY
      - name: Backfill month
        shell: bash
        run: |
          args=(--start "${{ matrix.start }}" --end "${{ matrix.end }}"
                --market "${{ inputs.market }}"
                --max-files "${{ inputs.max_files_per_month }}"
                --download-files
                --output "artifacts/backfill-${{ matrix.start }}-${{ matrix.end }}")
          if [[ "${{ inputs.upload_drive }}" == "true" ]]; then args+=(--upload-drive); fi
          python -m src.research_complete "${args[@]}"
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: juchao-backfill-${{ matrix.start }}-${{ matrix.end }}
          path: artifacts/backfill-${{ matrix.start }}-${{ matrix.end }}/
          if-no-files-found: warn
          retention-days: 14
