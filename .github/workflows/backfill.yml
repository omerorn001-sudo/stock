name: juchao-history-backfill

on:
  workflow_dispatch:
    inputs:
      start:
        description: "历史回填开始日期 YYYY-MM-DD"
        required: true
      end:
        description: "历史回填结束日期 YYYY-MM-DD"
        required: true
      market:
        description: "市场范围"
        type: choice
        options: [all, sh, sz]
        default: all
      upload_drive:
        description: "上传到 Google Drive（推荐 Apps Script；未配置时请关闭）"
        type: boolean
        default: false
      max_files_per_month:
        description: "每月最多处理数量；0表示不限制"
        required: true
        default: "3"

concurrency:
  group: juchao-history-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - id: matrix
        name: Split range into calendar months
        run: python scripts/backfill_matrix.py --start "${{ inputs.start }}" --end "${{ inputs.end }}"

  backfill:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      id-token: write
    env:
      TZ: Asia/Shanghai
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
      GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
      GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
      GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
      GDRIVE_SHARED_DRIVE_ID: ${{ secrets.GDRIVE_SHARED_DRIVE_ID }}
      GDRIVE_BASE_PATH: ${{ vars.GDRIVE_BASE_PATH || 'CNINFO/机构调研' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-juchao.txt
      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-juchao.txt
      - name: Validate Drive configuration
        id: preflight
        shell: bash
        run: |
          apps_any=false
          apps_ready=false
          oauth_any=false
          oauth_ready=false
          wif_any=false
          wif_ready=false
          if [[ -n "$GDRIVE_APPS_SCRIPT_URL" || -n "$GDRIVE_APPS_SCRIPT_TOKEN" ]]; then apps_any=true; fi
          if [[ -n "$GDRIVE_APPS_SCRIPT_URL" && -n "$GDRIVE_APPS_SCRIPT_TOKEN" ]]; then apps_ready=true; fi
          if [[ -n "$GDRIVE_OAUTH_CLIENT_ID" || -n "$GDRIVE_OAUTH_CLIENT_SECRET" || -n "$GDRIVE_OAUTH_REFRESH_TOKEN" ]]; then oauth_any=true; fi
          if [[ -n "$GDRIVE_OAUTH_CLIENT_ID" && -n "$GDRIVE_OAUTH_CLIENT_SECRET" && -n "$GDRIVE_OAUTH_REFRESH_TOKEN" ]]; then oauth_ready=true; fi
          if [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || -n "$GCP_SERVICE_ACCOUNT" ]]; then wif_any=true; fi
          if [[ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" && -n "$GCP_SERVICE_ACCOUNT" ]]; then wif_ready=true; fi

          backend=not_configured
          config_error=""
          if [[ "$apps_any" == "true" ]]; then
            if [[ "$apps_ready" == "true" ]]; then backend=apps_script; else config_error="Apps Script 需要同时配置 URL 和 TOKEN"; fi
          elif [[ "$oauth_any" == "true" ]]; then
            if [[ "$oauth_ready" == "true" ]]; then backend=oauth; else config_error="OAuth 三项凭据不完整"; fi
          elif [[ "$wif_any" == "true" ]]; then
            if [[ "$wif_ready" == "true" ]]; then backend=wif; else config_error="WIF 两项配置不完整"; fi
          fi
          if [[ "${{ inputs.upload_drive }}" == "true" && -n "$config_error" ]]; then
            echo "::error::$config_error"
            exit 1
          fi
          if [[ "${{ inputs.upload_drive }}" == "true" && "$backend" == "not_configured" ]]; then
            echo "::error::已选择上传 Drive，但尚未配置 Apps Script、OAuth 或 WIF"
            exit 1
          fi
          use_wif=false
          if [[ "$backend" == "wif" ]]; then use_wif=true; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "use_wif=$use_wif" >> "$GITHUB_OUTPUT"
      - name: Authenticate with Workload Identity Federation
        if: inputs.upload_drive == true && steps.preflight.outputs.use_wif == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
      - name: Check Apps Script Drive gateway
        if: inputs.upload_drive == true && steps.preflight.outputs.backend == 'apps_script'
        run: |
          python - <<'PY'
          from src.apps_script_storage import AppsScriptDriveClient
          result = AppsScriptDriveClient().ping()
          print("Apps Script Drive 网关连接成功：" + str(result.get("service") or "ok"))
          PY
      - name: Backfill month
        shell: bash
        run: |
          args=(--start "${{ matrix.start }}" --end "${{ matrix.end }}" --market "${{ inputs.market }}"
                --max-files "${{ inputs.max_files_per_month }}" --download-files
                --output "artifacts/backfill-${{ matrix.start }}-${{ matrix.end }}")
          if [[ "${{ inputs.upload_drive }}" == "true" ]]; then args+=(--upload-drive); fi
          python -m src.pipeline "${args[@]}"
      - name: Upload monthly artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: juchao-backfill-${{ matrix.start }}-${{ matrix.end }}
          path: artifacts/backfill-${{ matrix.start }}-${{ matrix.end }}/
          if-no-files-found: warn
          retention-days: 14

  report-failure:
    needs: backfill
    if: always() && needs.backfill.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo,
              title: '[juchao] 历史回填存在失败月份',
              body: `请检查运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
