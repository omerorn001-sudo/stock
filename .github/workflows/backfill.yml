name: juchao-history-backfill

on:
  schedule:
    # 每个工作日 UTC 13:00 = 北京时间 21:00，自动采集最近 7 天的机构调研公告（已归档的自动跳过）
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      start:
        description: "回填开始日期 YYYY-MM-DD；留空 = 7 天前"
        required: false
        default: ""
      end:
        description: "回填结束日期 YYYY-MM-DD；留空 = 今天"
        required: false
        default: ""
      market:
        description: "市场范围（北交所始终排除）"
        type: choice
        options: [all, sh, sz]
        default: all
      upload_drive:
        description: "将统一生成的 PDF 上传到 Google Drive"
        type: boolean
        default: true
      max_files_per_month:
        description: "每月最多处理数量；0表示不限制"
        required: false
        default: "0"

concurrency:
  group: juchao-history-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 校验 PDF 工具脚本
        run: python -m py_compile scripts/pdf_drive.py
      - id: matrix
        shell: bash
        env:
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          start=$(echo "${IN_START:-}" | tr -d '[:space:]'); end=$(echo "${IN_END:-}" | tr -d '[:space:]')
          start=${start:-$(TZ=Asia/Shanghai date -d '7 days ago' +%F)}
          end=${end:-$(TZ=Asia/Shanghai date +%F)}
          echo "回填区间：$start ~ $end"
          python scripts/backfill_matrix.py --start "$start" --end "$end" --days 7

  backfill:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
      GDRIVE_BASE_PATH: ${{ vars.GDRIVE_BASE_PATH || 'CNINFO/机构调研' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-juchao.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-juchao.txt
      - name: 安装 PDF 转换工具
        shell: bash
        run: |
          if ! command -v libreoffice >/dev/null 2>&1 && ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk
          fi
      - name: Check Drive gateway
        if: github.event_name == 'schedule' || inputs.upload_drive == true
        run: |
          if [[ -z "$GDRIVE_APPS_SCRIPT_URL" || -z "$GDRIVE_APPS_SCRIPT_TOKEN" ]]; then
            echo "::error::上传 Drive 需要 Apps Script URL 和 TOKEN"
            exit 1
          fi
          python - <<'PY'
          from src.apps_script_storage import AppsScriptDriveClient
          print(AppsScriptDriveClient().ping().get('service') or 'ok')
          PY
      - name: 回填、统一生成 PDF 并归档
        shell: bash
        run: |
          output="artifacts/backfill-${{ matrix.start }}-${{ matrix.end }}"
          archive_args=(--start "${{ matrix.start }}" --end "${{ matrix.end }}"
                --market "${{ inputs.market || 'all' }}"
                --max-files "${{ inputs.max_files_per_month || '0' }}"
                --download-files
                --output "$output")

          set +e
          python -m src.research_complete "${archive_args[@]}"
          archive_status=$?

          pdf_args=(backfill --output "$output")
          if [[ "${{ github.event_name == 'schedule' || inputs.upload_drive }}" == "true" ]]; then
            pdf_args+=(--upload-drive)
          fi
          python scripts/pdf_drive.py "${pdf_args[@]}"
          pdf_status=$?
          set -e

          if [[ "$archive_status" -ne 0 || "$pdf_status" -ne 0 ]]; then
            echo "::error::原始采集状态=${archive_status}，PDF/Drive 状态=${pdf_status}"
            exit 1
          fi
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: juchao-backfill-${{ matrix.start }}-${{ matrix.end }}
          path: artifacts/backfill-${{ matrix.start }}-${{ matrix.end }}/
          if-no-files-found: warn
          retention-days: 14
