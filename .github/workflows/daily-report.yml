name: A股每日涨跌幅报告

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30，周一至周五（收盘后运行；非交易日脚本会自动跳过）
    # 注意：GitHub Actions 定时任务可能有数分钟至数十分钟延迟
    - cron: '30 8 * * 1-5'
  workflow_dispatch: {}   # 支持手动触发（Actions 页面点 Run workflow）

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 生成报告
        run: bun run src/main.ts

      - name: 提交报告到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ || true
          if git diff --cached --quiet; then
            echo "无新报告（可能为非交易日），跳过提交"
          else
            git commit -m "report: $(date -u -d '+8 hours' +%F)"
            git push
          fi
