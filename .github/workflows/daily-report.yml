name: A股每日涨跌幅报告

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30，周一至周五（收盘后运行；非交易日脚本会自动跳过）
    # 注意：GitHub Actions 定时任务可能有数分钟至数十分钟延迟
    - cron: '30 8 * * 1-5'
  workflow_dispatch: {}   # 支持手动触发（Actions 页面点 Run workflow）

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 生成报告
        run: bun run src/main.ts

      - name: 提交报告到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ || true
          if git diff --cached --quiet; then
            echo "无新报告（可能为非交易日），跳过提交"
          else
            git commit -m "report: $(date -u -d '+8 hours' +%F)"
            git push
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 归档到 Google Drive（CNINFO/A股每日涨跌幅报告）
        shell: bash
        run: |
          d=$(TZ=Asia/Shanghai date +%F)
          if [[ ! -f "reports/$d.html" ]]; then
            echo "今日无新报告（非交易日），跳过 Drive 归档"; exit 0
          fi
          python -m pip install --quiet "requests>=2.32,<3"
          python scripts/drive_archive.py --dataset daily_report --date "$d" "reports/$d.html"
