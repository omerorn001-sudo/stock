name: A股每日涨跌幅报告

on:
  schedule:
    # UTC 08:30 = 北京时间 16:30，周一至周五（收盘后运行；非交易日自动跳过）
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '单日：报告日期 YYYY-MM-DD；留空 = 今天（北京时间）'
        required: false
        default: ''
      start:
        description: '批量补全：开始日期 YYYY-MM-DD（填了就按区间补全，忽略上面的单日）'
        required: false
        default: ''
      end:
        description: '批量补全：结束日期 YYYY-MM-DD；留空 = 今天'
        required: false
        default: ''
      regenerate:
        description: '已存在的 HTML 也重新生成（默认只补缺失的，已有的只补 PDF 和 Drive）'
        type: boolean
        default: false
      upload_drive:
        description: '上传 HTML + PDF 到 Google Drive（CNINFO/A股每日涨跌幅报告）'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-report-${{ inputs.start || inputs.date || 'today' }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        shell: bash
        env:
          IN_DATE: ${{ inputs.date }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          today=$(date +%F)
          start=$(echo "${IN_START:-}" | tr -d '[:space:]'); end=$(echo "${IN_END:-}" | tr -d '[:space:]')
          single=$(echo "${IN_DATE:-}" | tr -d '[:space:]')
          if [[ -n "$start" ]]; then
            matrix=$(python scripts/trading_days.py --start "$start" --end "${end:-$today}" --chunk 8 --matrix)
          else
            d="${single:-$today}"
            if [[ "$d" != "$today" ]]; then python scripts/report_date.py --date "$d" >/dev/null; fi
            matrix=$(jq -cn --arg d "$d" '{include:[{label:$d,dates:$d}]}')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[].label'

  report:
    needs: plan
    name: report ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      GDRIVE_APPS_SCRIPT_URL: ${{ secrets.GDRIVE_APPS_SCRIPT_URL }}
      GDRIVE_APPS_SCRIPT_TOKEN: ${{ secrets.GDRIVE_APPS_SCRIPT_TOKEN }}
      GDRIVE_APPS_SCRIPT_MAX_BYTES: ${{ vars.GDRIVE_APPS_SCRIPT_MAX_BYTES || '36700160' }}
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload_drive }}
      REGENERATE: ${{ inputs.regenerate }}
      DATES: ${{ matrix.dates }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 PDF 中文字体与上传依赖
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          python -m pip install --quiet "requests>=2.32,<3"

      - name: 生成 HTML 报告
        shell: bash
        run: |
          today=$(date +%F); failed=0
          for d in $DATES; do
            if [[ -f "reports/$d.html" && "$REGENERATE" != "true" && "$d" != "$today" ]]; then
              echo "✓ $d 已有 HTML，跳过生成"; continue
            fi
            if [[ "$d" == "$today" ]]; then
              bun run src/main.ts || { echo "::error::$d 当日报告生成失败"; failed=1; }
            else
              REPORT_DATE="$d" bun run src/report-by-date.ts "$d" || { echo "::error::$d 历史报告生成失败"; failed=1; }
            fi
          done
          echo "FAILED=$failed" >> "$GITHUB_ENV"

      - name: 提交 HTML 到仓库
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.html || true
          if git diff --cached --quiet; then echo "没有新的 HTML"; exit 0; fi
          git commit -q -m "report: ${{ matrix.label }}"
          for attempt in 1 2 3 4 5 6; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 20 + 5))
          done
          exit 1

      - name: 归档 HTML + PDF 到 Google Drive
        if: env.UPLOAD == 'true'
        shell: bash
        run: |
          for d in $DATES; do
            if [[ ! -f "reports/$d.html" ]]; then echo "没有 $d 的报告（非交易日或生成失败），跳过"; continue; fi
            python scripts/drive_archive.py --dataset daily_report --date "$d" "reports/$d.html" \
              || echo "FAILED=1" >> "$GITHUB_ENV"
          done

      - name: 汇总
        if: always()
        run: test "${FAILED:-0}" = "0"
